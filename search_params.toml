[grid]
# Large overnight sweep (~972 combos).
# Human-friendly keys (mapped to runtime fusion_* attrs internally).
d_model = [128, 192, 256]
drop = [0.15, 0.25, 0.35]
lr = [0.00005, 0.0001, 0.0002]
weight_decay = [0.0001, 0.0005, 0.001]
optimizer = ["adamw", "adam", "rmsprop"]
scheduler_type = ["plateau", "cosine"]
label_smoothing = [0.0, 0.05]

[defaults]
# Fixed settings applied for every run in search.
input_type = "emb"
fusion_type = "exchange_transformer"
x_layers = 2
x_heads = 4
x_ff_mult = 4
x_use_cls = true
num_epochs = 30
max_patience = 6
grad_clip = 1.0
class_weighting = "balanced"
loss_name = "cross_entropy"
