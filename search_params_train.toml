[grid]
# Stage 2: training-params sweep (run after Stage 1).
# Keep model params fixed in [defaults] to the best Stage 1 combo.
optimizer = ["rmsprop", "adam"]
lr = [0.00005, 0.0001, 0.0002, 0.0003]
weight_decay = [0.0001, 0.0005, 0.001]
scheduler_type = ["plateau", "cosine"]
label_smoothing = [0.0, 0.05]
grad_clip = [0.5, 1.0, 2.0]

[defaults]
input_type = "emb"
fusion_type = "videoformer"
videoformer_positional_encoding = false

# Replace these with best Stage 1 values:
d_model = 256
drop = 0.25
x_layers = 3
x_heads = 4
videoformer_gate_mode = "none"

num_epochs = 30
max_patience = 6
class_weighting = "balanced"
loss_name = "cross_entropy"
